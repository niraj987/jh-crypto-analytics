<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="nodeGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0ea5e9" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="950" height="360" rx="20" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title -->
  <text x="40" y="38" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="900" letter-spacing="1">
    INSTITUTIONAL QUANTITATIVE TRADING FIRM WORKFLOW PIPELINE
  </text>
  <text x="750" y="38" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold">
    END-TO-END EXECUTION
  </text>

  <!-- Connecting Curved Pipe / Bus -->
  <path d="M 140 180 L 330 180 L 530 180 L 730 180" fill="none" stroke="url(#flowGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 140 180 L 330 180 L 530 180 L 730 180" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 15" opacity="0.6"/>

  <!-- NODE 1: Alpha Generation (How Firm Suggests) -->
  <g transform="translate(40, 75)">
    <rect width="200" height="210" rx="16" fill="#1e293b" stroke="#0284c7" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="36" cy="36" r="16" fill="#0284c7" fill-opacity="0.2"/>
    <text x="36" y="41" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="black">01</text>
    <text x="64" y="40" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="extrabold">ALPHA DISCOVERY</text>
    
    <text x="18" y="75" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">HOW FIRMS SUGGEST:</text>
    <text x="18" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Multi-Factor Alphas</text>
    <text x="18" y="118" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Order-Flow Imbalance (OFI)</text>
    <text x="18" y="138" fill="#cbd5e1" font-family="sans-serif" font-size="11">• RAG Macro Vector Memory</text>
    <text x="18" y="158" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Composite Score [-100, +100]</text>
    
    <rect x="18" y="175" width="164" height="26" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
    <text x="100" y="192" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">Output: High-Conviction Signal</text>
  </g>

  <!-- NODE 2: Risk Management (How Firm Sizes Position) -->
  <g transform="translate(250, 75)">
    <rect width="200" height="210" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="36" cy="36" r="16" fill="#10b981" fill-opacity="0.2"/>
    <text x="36" y="41" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="12" font-weight="black">02</text>
    <text x="64" y="40" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="extrabold">RISK & POSITIONING</text>
    
    <text x="18" y="75" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">HOW FIRMS MANAGE RISK:</text>
    <text x="18" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Fractional Kelly Sizing (0.25f*)</text>
    <text x="18" y="118" fill="#cbd5e1" font-family="sans-serif" font-size="11">• ATR Dynamic Stop-Loss</text>
    <text x="18" y="138" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 99% Parametric VaR Caps</text>
    <text x="18" y="158" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Volatility Parity Scaling</text>
    
    <rect x="18" y="175" width="164" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="100" y="192" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">Output: Lot Size in INR (₹)</text>
  </g>

  <!-- NODE 3: Smart Execution (How Firm Buys & Sells) -->
  <g transform="translate(460, 75)">
    <rect width="200" height="210" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="36" cy="36" r="16" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="36" y="41" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="black">03</text>
    <text x="64" y="40" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="extrabold">SMART EXECUTION</text>
    
    <text x="18" y="75" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="bold">HOW FIRMS BUY & SELL:</text>
    <text x="18" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="11">• TWAP Time Slicing</text>
    <text x="18" y="118" fill="#cbd5e1" font-family="sans-serif" font-size="11">• VWAP Volume Curves</text>
    <text x="18" y="138" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Iceberg Stealth Queuing</text>
    <text x="18" y="158" fill="#cbd5e1" font-family="sans-serif" font-size="11">• MEV Front-Run Shield</text>
    
    <rect x="18" y="175" width="164" height="26" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="100" y="192" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="bold">Output: Zero-Impact Fill</text>
  </g>

  <!-- NODE 4: Portfolio Hedging (How Firm Manages All) -->
  <g transform="translate(670, 75)">
    <rect width="240" height="210" rx="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="36" cy="36" r="16" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="36" y="41" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="12" font-weight="black">04</text>
    <text x="64" y="40" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="extrabold">HEDGE & ATTRIBUTION</text>
    
    <text x="18" y="75" fill="#c084fc" font-family="monospace" font-size="10" font-weight="bold">HOW FIRMS MANAGE ALL:</text>
    <text x="18" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Delta-Neutral (β=0) Hedging</text>
    <text x="18" y="118" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Long Altcoin / Short BTC Perp</text>
    <text x="18" y="138" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Funding Rate Yield Arbitrage</text>
    <text x="18" y="158" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Circuit Breaker Safeguards</text>
    
    <rect x="18" y="175" width="204" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
    <text x="120" y="192" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="10" font-weight="bold">Output: Market-Neutral Alpha</text>
  </g>

  <!-- Bottom Ticker -->
  <text x="40" y="325" fill="#64748b" font-family="monospace" font-size="11">
    JH CRYPTO ANALYTICS PROPRIETARY ARCHITECTURE • ACTIVE MULTI-AGENT QUANTITATIVE ENGINE
  </text>
</svg>
